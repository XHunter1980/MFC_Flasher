name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Проверка синтаксиса и зависимостей
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Синтаксическая проверка кода (py_compile)
        run: python -m py_compile MFC_Module_Updater_v1.53.py

      - name: Установка зависимостей из requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка импорта модулей зависимостей
        run: |
          python -c "import paramiko; print('paramiko', paramiko.__version__)"
          python -c "import PyQt6; print('PyQt6 OK')"
