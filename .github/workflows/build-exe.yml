name: Build Windows EXE

# Сборка .exe через PyInstaller на windows-latest.
# 1) Ручной запуск (Actions -> Build Windows EXE -> Run workflow): артефакт dist-экземпляр.
# 2) Push тега vX.Y.Z: сборка + автоматический релиз GitHub с вложенным .exe.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Сборка MFC_Flasher.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Сборка exe (onefile, без консоли)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name MFC_Flasher \
            MFC_Module_Updater_v1.53.py

      - name: Проверка результата сборки
        shell: bash
        run: |
          test -f dist/MFC_Flasher.exe
          ls -la dist/

      - name: Загрузка артефакта (для ручного запуска)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MFC_Flasher-windows
          path: dist/MFC_Flasher.exe
          if-no-files-found: error

      - name: Создание релиза с .exe (при пуше тега)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MFC_Flasher.exe
          generate_release_notes: true
          draft: false
          prerelease: false
